name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format gcc-arm-none-eabi

      - name: Check clang-format
        run: find . -path './build' -prune -o -type f \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Run clang-tidy
        run: find . -path './build' -prune -o -type f -name '*.c' -print0 | \
              xargs -0 -I{} clang-tidy {} \
              -- \
              --target=arm-none-eabi \
              -march=armv7-m \
              -std=c11 \
              -I./include \
              -isystem /usr/arm-none-eabi/include \
              -isystem /usr/lib/gcc/arm-none-eabi/13.2.1/include \
              -isystem /usr/lib/gcc/arm-none-eabi/13.2.1/include-fixed

