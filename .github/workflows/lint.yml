name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format gcc-arm-none-eabi

      - name: Check clang-format
        run: find . -path './build' -prune -o -type f \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Run clang-tidy
        run: find . -path './build' -prune -o -name '*.c' -print0 | xargs -0 clang-tidy -- --target=arm-none-eabi -march=armv7-m -isystem /usr/arm-none-eabi/include -std=c11 -I./include